name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install
      - run: npm run build -w packages/core
      - run: npm run build -w packages/lang-javascript
      - run: npm run build -w packages/cli
      - run: npm run build -w packages/web
      - run: npm run build -w packages/mcp
      - run: npm test

      - name: Package tarball
        run: |
          tar -czf grail-${{ github.event.release.tag_name }}.tar.gz \
            --exclude=node_modules \
            --exclude=.git \
            packages/*/dist \
            packages/*/package.json \
            packages/*/src \
            package.json \
            README.md \
            LICENSE

      - name: Upload release artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.event.release.tag_name }} grail-${{ github.event.release.tag_name }}.tar.gz

      - run: npm publish -w packages/core --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm publish -w packages/lang-javascript --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm publish -w packages/cli --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm publish -w packages/web --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm publish -w packages/mcp --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
