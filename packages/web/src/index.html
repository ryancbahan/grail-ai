<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grail</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #app { height: 100%; }
    body {
      background: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    }
    header {
      padding: 16px 24px;
      border-bottom: 1px solid #21262d;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 {
      font-size: 18px;
      font-weight: 600;
      color: #f0f6fc;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }
    header span {
      font-size: 13px;
      color: #8b949e;
    }
    .main-layout {
      display: flex;
      height: calc(100vh - 57px);
    }
    .tree-container {
      overflow: auto;
      flex: 1;
      position: relative;
    }
    .sidebar {
      width: 300px;
      border-left: 1px solid #21262d;
      background: #161b22;
      overflow-y: auto;
      flex-shrink: 0;
    }
    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid #21262d;
    }
    .sidebar-title {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 14px;
      font-weight: 600;
      color: #f0f6fc;
    }
    .sidebar-close {
      background: none;
      border: 1px solid #30363d;
      color: #8b949e;
      border-radius: 4px;
      width: 24px;
      height: 24px;
      cursor: pointer;
      font-size: 12px;
      line-height: 1;
    }
    .sidebar-close:hover { color: #f0f6fc; border-color: #8b949e; }
    .sidebar-path {
      padding: 8px 16px;
      font-size: 12px;
      color: #8b949e;
      font-family: 'SF Mono', 'Fira Code', monospace;
      border-bottom: 1px solid #21262d;
    }
    .sidebar-empty {
      padding: 16px;
      font-size: 13px;
      color: #484f58;
    }
    .import-list {
      list-style: none;
      padding: 8px 0;
    }
    .import-list li {
      padding: 6px 16px;
      font-size: 13px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .import-list li.local { color: #c9d1d9; }
    .import-list li.external { color: #8b949e; }
    .import-list li:hover { background: #1c2129; }
    .import-kind {
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 3px;
      background: #21262d;
      color: #8b949e;
      flex-shrink: 0;
    }
    .import-specifier {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .import-badge {
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 3px;
      background: #1f2328;
      color: #636c76;
      flex-shrink: 0;
    }
    .node { transition: opacity 0.2s; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/bundle.js"></script>
</body>
</html>
